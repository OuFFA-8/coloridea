<div class="fixed inset-0 z-[200] flex flex-col bg-[#0e0e0e]">
  <!-- Header -->
  <div
    class="flex items-center justify-between p-4 sm:p-5 sm:px-6 bg-white/5 border-b border-white/10 flex-shrink-0 backdrop-blur-md"
  >
    <div class="flex items-center gap-3 min-w-0">
      <button
        (click)="goBack()"
        class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 border-none cursor-pointer transition-colors bg-white/10 hover:bg-[#fa8728] text-white"
        aria-label="Back"
      >
        <svg class="w-4 h-4 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <div class="min-w-0">
        <h1
          class="text-white font-black text-base sm:text-lg truncate"
          style="font-family: 'Alexandria', sans-serif"
        >
          {{ title }}
        </h1>
        <p class="text-[9px] font-bold text-[#fa8728] uppercase tracking-widest mt-0.5">
          Timelapse
        </p>
      </div>
    </div>

    <button
      (click)="openExternal()"
      class="flex-shrink-0 px-3 sm:px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest border-none cursor-pointer transition-all bg-white/10 hover:bg-white/20 text-white"
    >
      فتح في تاب جديد ↗
    </button>
  </div>

  <!-- Body -->
  <div class="flex-1 relative overflow-hidden">
    @if (isLoading) {
      <div class="absolute inset-0 flex items-center justify-center bg-[#0e0e0e] z-10">
        <div class="flex flex-col items-center gap-3">
          <div
            class="w-10 h-10 border-4 border-[#fa8728]/30 border-t-[#fa8728] rounded-full animate-spin"
          ></div>
          <p class="text-white/40 text-xs font-bold uppercase tracking-widest">
            {{ 'COMMON.LOADING' | translate }}
          </p>
        </div>
      </div>
    }

    @if (hasError) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 p-8 text-center">
        <span class="text-4xl opacity-30">⚠️</span>
        <p class="text-white/50 text-sm font-bold">تعذّر عرض المحتوى</p>
        <button
          (click)="goBack()"
          class="px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest border-none cursor-pointer bg-[#fa8728] hover:bg-[#f97316] text-white transition-all"
        >
          {{ 'COMMON.BACK' | translate }}
        </button>
      </div>
    }

    @if (safeUrl && !hasError) {
      <iframe
        [src]="safeUrl"
        (load)="onIframeLoad()"
        (error)="onIframeError()"
        class="w-full h-full border-0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen
        loading="eager"
      ></iframe>
    }
  </div>
</div>
